name: refresh data

# 为什么要有这个：README 里的排序表是静态生成的，而徽章是实时的。
# 如果没人跑脚本，排序会慢慢跟徽章对不上。⛔ 所以让机器每天跑，
# 而不是指望有人记得 —— 没人会去更新的结构化声明，比没有声明更糟。
on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC，避开整点
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: fetch fresh star data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_stars.py

      - name: regenerate README
        run: python3 scripts/gen_readme.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: refresh star data"
            git push
          else
            echo "no change"
          fi
